<script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>

<!-- 2. ng-app marks the Angular boundary -->
<html ng-app="myApp">

  <!-- 3. ng-controller connects JavaScript to HTML -->
  <div ng-controller="MyCtrl">
    <p>Hello, {{ name }}!</p>   <!-- displays $scope.name -->
    <p>Students: {{ students.length }}</p>
    <table>
        <tr>
            <th>Name</th>
            <th>GPA</th>
        </tr>
        <tr ng-repeat="student in students">
            <td>{{ student.name }}</td>
            <td>{{ student.gpa }}</td>
        </tr>
    </table>
  </div>

</html>

<script>
// JavaScript
var app = angular.module('myApp', []);

app.controller('MyCtrl', function($scope) {
  $scope.name = 'VTU Student';  // shows in HTML
  $scope.students = [
    { name: 'Arjun', gpa: 8.7 },
    { name: 'Priya', gpa: 9.1 },
    { name: 'Ravi', gpa: 7.5 },
    { name: 'Anjali', gpa: 8.2 },
    { name: 'Karthik', gpa: 6.9 },
  ];
});
</script>
